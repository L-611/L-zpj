<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-611的作品集</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #111; 
    color: #fff;
    overflow-x: hidden;
  }

  /* ===== 页面切换核心 ===== */
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }

  /* ===== 首页排版 ===== */
  #home {
    height: 100vh; 
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;     
    text-align: center;
    background-image: url('images/fengmian.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden; 
  }

  #home h1 { font-size: 36px; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }

  /* ===== 磨砂按钮 ===== */
  .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 700px; margin-bottom: 50px; }
  .btn {
    padding: 12px 32px;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.15); 
    backdrop-filter: blur(12px);           
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;                        
    border: 1px solid rgba(255, 255, 255, 0.3); 
    border-radius: 50px !important; 
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px); }

  /* ===== 云朵专属样式 ===== */
  .cloud-container {
    margin-top: 20px;
    cursor: pointer;
    transition: transform 0.3s;
    animation: floatCloud 4s ease-in-out infinite; 
  }
  .cloud-container:hover { transform: scale(1.1); }
  .cloud-container svg {
    width: 120px;
    height: auto;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); 
    opacity: 0.8;
  }

  @keyframes floatCloud {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
  }

  /* ===== 作品页排版 ===== */
  .page h2 { font-size: 26px; margin: 40px auto 20px; text-align: center; }
  .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto 40px; padding: 0 20px; }
  .work-card { background: #fff; border-radius: 12px; overflow: hidden; color: #222; }
  .gallery { margin-bottom: 10px; }
  .main-img { width: 100%; height: 350px; object-fit: cover; display: block; background: #ccc; }
  .thumbs { display: flex; gap: 8px; padding: 10px; background: #fafafa; overflow-x: auto; white-space: nowrap; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; background: #ccc; border-radius: 4px; }
  .desc { padding: 16px; font-size: 14px; line-height: 1.6; }
  .desc strong { display: block; margin-bottom: 8px; font-size: 16px; }

  /* ===== 悬浮返回按钮 ===== */
  .back {
    position: fixed; top: 20px; left: 20px; padding: 10px 20px;
    background: #fff; color: #333; border: none; border-radius: 50px;
    cursor: pointer; z-index: 99999; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .back.show { display: block; }

  .footer-text { position: absolute; bottom: 15px; width: 100%; text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); }

  /* ===== 小彩蛋页面 ===== */
  #poem-page {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #0a0a0a; 
  }
  #poem-page p {
    font-size: 24px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.85);
    line-height: 2;
    font-weight: 300;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }
</style>
</head>

<body>

<!-- 悬浮返回按钮 -->
<button id="global-back" class="back" onclick="showPage('home')">← 返回首页</button>

<!-- ========== 首页 ========== -->
<div id="home" class="page active">
  <h1>L-611的作品集</h1>
  
  <!-- 首页按钮 -->
  <div class="btn-group">
    <button class="btn" onclick="showPage('sanwei')">三维建模</button>
    <button class="btn" onclick="showPage('erwei')">二维设计</button>
    <button class="btn" onclick="showPage('donghua')">动画作品</button>
    <button class="btn" onclick="showPage('zonghe')">综合创作</button>
  </div>

  <!-- ☁️ 神奇的云 -->
  <div class="cloud-container" onclick="showPage('poem-page')">
    <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.6)" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.5 19H6.5C4.01472 19 2 16.9853 2 14.5C2 12.1322 3.83267 10.1867 6.1536 10.0212C6.75651 7.73968 8.83478 6 11.25 6C13.9869 6 16.25 8.09277 16.4922 10.7645C18.5028 11.1326 20 12.8845 20 15C20 17.2091 18.2091 19 16 19H17.5Z" />
    </svg>
  </div>

  <div class="footer-text">© 2024 L-611. 保留所有权利。</div>
</div>

<!-- ========== 1. 三维建模（文件夹用 images/sanwei/） ========== -->
<div id="sanwei" class="page">

        <img src="images/sanwei/1-A.png" class="main-img" alt="主图">

          <img src="images/sanwei/1-B.png" onclick="changeImg(this, 'images/sanwei/1-B.png')">
          <img src="images/sanwei/1-C.png" onclick="changeImg(this, 'images/sanwei/1-C.png')">

        <strong>作品名称：小木屋</strong>
        blender制作
      </div>
    </div>

    <!-- “拥挤的房间” -->
    <div class="work-card">
      <div class="gallery">
        <img src="images/sanwei/2-A.png" class="main-img" alt="主图">
        <div class="thumbs">
          <img src="images/sanwei/2-A.png" onclick="changeImg(this, 'images/sanwei/2-A.png')">
          <img src="images/sanwei/2-B.png" onclick="changeImg(this, 'images/sanwei/2-B.png')">
          <img src="images/sanwei/2-C.png" onclick="changeImg(this, 'images/sanwei/2-C.png')">
          <img src="images/sanwei/2-D.png" onclick="changeImg(this, 'images/sanwei/2-D.png')">
          <img src="images/sanwei/2-E.png" onclick="changeImg(this, 'images/sanwei/2-E.png')">
          <img src="images/sanwei/2-F.png" onclick="changeImg(this, 'images/sanwei/2-F.png')">
          <img src="images/sanwei/2-G.png" onclick="changeImg(this, 'images/sanwei/2-G.png')">
          <img src="images/sanwei/2-H.png" onclick="changeImg(this, 'images/sanwei/2-H.png')">
        </div>
      </div>
      <div class="desc">
        <strong>作品名称：拥挤的房间</strong>
        blender制作
      </div>
    </div>
   
    <!-- “长臂机器人” -->
    <div class="work-card">
      <div class="gallery">
        <img src="images/sanwei/3-A.jpg" class="main-img" alt="主图">
        <div class="thumbs">
          <img src="images/sanwei/3-A.jpg" onclick="changeImg(this, 'images/sanwei/3-A.jpg')">
          <img src="images/sanwei/3-B.jpg" onclick="changeImg(this, 'images/sanwei/3-B.jpg')">
          <img src="images/sanwei/3-C.jpg" onclick="changeImg(this, 'images/sanwei/3-C.jpg')">
          <img src="images/sanwei/3-D.jpg" onclick="changeImg(this, 'images/sanwei/3-D.jpg')">
        </div>
      </div>
      <div class="desc">
        <strong>作品名称：长臂机器人</strong>
        ZBrush制作
      </div>
    </div>

  </div>
</div>

<!-- ========== 2. 二维设计（文件夹用 images/erwei/） ========== -->
<div id="erwei" class="page">
  <h2>二维设计</h2>
  <div class="works">
    <!-- 以后放这里，图片路径写 images/erwei/... -->
  </div>
</div>

<!-- ========== 3. 动画作品（文件夹用 images/donghua/） ========== -->
<div id="donghua" class="page">

  <div class="works">
    <!-- 以后放这里，图片路径写 images/donghua/... -->

   <!-- “僵尸跳舞” -->
   <div class="work-card">
      <div style="width: 100%; height: 350px; background: #000;">
       <iframe src="https://player.bilibili.com/player.html?bvid=BV1YQn96fEnd&page=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:100%;"></iframe>

      <div class="desc">

   <!-- “《喜羊羊与灰太狼》练习制作” -->
   <div class="work-card">
      <div style="width: 100%; height: 350px; background: #000;">
       <iframe src="https://player.bilibili.com/player.html?bvid=BV12KnR6JEms&page=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:100%;"></iframe>

<!-- ========== 4. 综合创作（文件夹用 images/zonghe/） ========== -->
<div id="zonghe" class="page">
  <h2>综合创作</h2>
  <div class="works">
    <!-- 以后放这里，图片路径写 images/zonghe/... -->
   
    <!-- “鹿冠” -->
    <div class="work-card">
      <div class="gallery">
        <img src="images/zonghe/1-A.jpg" class="main-img" alt="主图">
        <div class="thumbs">
          <img src="images/zonghe/1-A.jpg" onclick="changeImg(this, 'images/zonghe/1-A.jpg')">
          <img src="images/zonghe/1-B.jpg" onclick="changeImg(this, 'images/zonghe/1-B.jpg')">
        </div>
      </div>
      <div class="desc">

        石塑粘土手工原创
      </div>

<!-- ========== 5. 彩蛋页面 ========== -->
<div id="poem-page" class="page">
  <p>闲云也恋人寰好<br>山下渟滢懒上尖</p>
</div>

<!-- 交互逻辑 -->
<script>
function showPage(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].style.display = 'none'; 
  }
  
  var targetPage = document.getElementById(id);
  if (targetPage) {
    if (id === 'home' || id === 'poem-page') {
      targetPage.style.display = 'flex'; 
    } else {
      targetPage.style.display = 'block'; 
    }
  }
  
  var backBtn = document.getElementById('global-back');
  if (id === 'home') {
    backBtn.style.display = 'none';
  } else {
    backBtn.style.display = 'block';
  }
  
  window.scrollTo(0, 0);
}

function changeImg(element, newSrc) {
  var card = element.closest('.work-card');
  var mainImg = card.querySelector('.main-img');
  mainImg.src = newSrc;
}
</script>

</body>
</html>
