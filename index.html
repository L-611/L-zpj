<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-611的作品集</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #111; color: #fff; scroll-behavior: smooth; }

  /* 强制每个板块占满一屏幕高 */
  section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }

  /* 首页专属 */
  #home {
    background-image: url('images/fengmian.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    text-align: center;
  }
  #home h1 { font-size: 36px; margin-bottom: 40px; color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }

  /* 按钮样式 */
  .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 700px; }
  .btn {
    padding: 12px 32px; font-size: 16px;
    background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
    color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); 
    border-radius: 50px; text-decoration: none; /* 注意这里，去掉了下划线 */
    transition: all 0.3s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px); }

  /* 作品页专属 */
  .works-container {
    background: #f7f7f7; color: #222; width: 100%; padding: 40px 20px;
    min-height: 100vh; display: block; /* 覆盖 section 的居中属性 */
  }
  .works-container h2 { text-align: center; margin-bottom: 30px; color: #222; }
  
  .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
  .work-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  
  .main-img { width: 100%; height: 350px; object-fit: cover; display: block; background: #ccc; }
  .thumbs { display: flex; gap: 8px; padding: 10px; background: #fafafa; }
  .thumbs img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; background: #ccc; }

  .desc { padding: 16px; font-size: 14px; line-height: 1.6; }
  .desc strong { display: block; margin-bottom: 8px; font-size: 16px; }

  /* 返回按钮 */
  .back-btn {
    display: inline-block; margin-top: 40px; padding: 10px 20px;
    background: #ddd; color: #333; border-radius: 50px; text-decoration: none;
  }
  .back-btn:hover { background: #ccc; }
</style>
</head>

<body>

<!-- ========== 首页 ========== -->
<section id="home">
  <h1>L-611的作品集</h1>
  
  <div class="btn-group">
    <!-- 注意这里的 href="#changjing"，这是 HTML 原生锚点 -->
    <a href="#changjing" class="btn">场景建模</a>
    <a href="#juese" class="btn">角色建模</a>
    <a href="#" class="btn">绘画作品</a>
  </div>
</section>

<!-- ========== 场景建模 ========== -->
<section id="changjing" class="works-container">
  <h2>场景建模</h2>
  
  <div class="works">
    <div class="work-card">
      <img src="images/changjing/1-A.jpg" class="main-img" alt="作品图">
      <div class="desc">
        <strong>作品名称：XXX</strong>
        这里写介绍。
      </div>
    </div>
  </div>

  <div style="text-align:center;">
    <!-- 点击回到 #home 锚点 -->
    <a href="#home" class="back-btn">← 返回首页</a>
  </div>
</section>

<!-- ========== 角色建模 ========== -->
<section id="juese" class="works-container">
  <h2>角色建模</h2>
  <div class="works">
    <div class="work-card">
      <img src="images/juese/1-A.jpg" class="main-img" alt="作品图">
      <div class="desc">
        <strong>作品名称：XXX</strong>
        这里写介绍。
      </div>
    </div>
  </div>
  <div style="text-align:center;">
    <a href="#home" class="back-btn">← 返回首页</a>
  </div>
</section>

</body>
</html>
