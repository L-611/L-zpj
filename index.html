<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-611的作品集</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #111; 
    color: #fff;
  }

  /* ===== 页面切换控制 ===== */
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }

  /* ===== 首页专属排版 ===== */
  #home {
    height: 100vh; 
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;     
    text-align: center;
    background-image: url('images/fengmian.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden; 
  }

  #home h1 { font-size: 36px; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }

  /* ===== 磨砂按钮 ===== */
  .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 700px; }
  .btn {
    padding: 12px 32px;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.15); 
    backdrop-filter: blur(12px);           
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;                        
    border: 1px solid rgba(255, 255, 255, 0.3); 
    border-radius: 50px !important; 
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-3px); }

  /* ===== 作品页排版 ===== */
  .page h2 { font-size: 26px; margin: 40px auto 20px; text-align: center; }
  .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto 40px; padding: 0 20px; }
  .work-card { background: #fff; border-radius: 12px; overflow: hidden; color: #222; }
  
  .gallery { margin-bottom: 10px; }
  .main-img { width: 100%; height: 350px; object-fit: cover; display: block; background: #ccc; }
  .thumbs { display: flex; gap: 8px; padding: 10px; background: #fafafa; }
  .thumbs img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; background: #ccc; }

  .desc { padding: 16px; font-size: 14px; line-height: 1.6; }
  .desc strong { display: block; margin-bottom: 8px; font-size: 16px; }

  /* ===== 悬浮返回按钮 ===== */
  .back {
    position: fixed; top: 20px; left: 20px; padding: 10px 20px;
    background: #fff; color: #333; border: none; border-radius: 50px;
    cursor: pointer; z-index: 99999; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .back.show { display: block; }

  /* ===== 底部版权小字 ===== */
  .footer-text {
    position: absolute; bottom: 15px; width: 100%; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.4);
  }
</style>
</head>

<body>

<!-- 悬浮返回按钮 -->
<button id="global-back" class="back" onclick="showPage('home')">← 返回首页</button>

<!-- ========== 首页 ========== -->
<div id="home" class="page active">
  <h1>L-611的作品集</h1>
  <div class="btn-group">
    <button class="btn" onclick="showPage('scene-modeling')">场景建模</button>
    <button class="btn" onclick="showPage('character-modeling')">角色建模</button>
    <button class="btn" onclick="showPage('painting')">绘画作品</button>
    <button class="btn" onclick="showPage('handcraft')">手工作品</button>
    <button class="btn" onclick="showPage('2d-animation')">二维动画</button>
    <button class="btn" onclick="showPage('3d-animation')">三维动画</button>
  </div>
  <div class="footer-text">© 2024 L-611. 保留所有权利。</div>
</div>

<!-- ========== 场景建模 ========== -->
<div id="scene-modeling" class="page">
  <h2>场景建模</h2>
  <div class="works">
    <div class="work-card">
      <div class="gallery">
        <img src="images/changjing/1-A.png" class="main-img" alt="主图">
        <div class="thumbs">
          <img src="images/changjing/1-A.png" onclick="changeImg(this, 'images/changjing/1-A.png')">
          <img src="images/changjing/1-B.png" onclick="changeImg(this, 'images/changjing/1-B.png')">
          <img src="images/changjing/1-C.png" onclick="changeImg(this, 'images/changjing/1-C.png')">
        </div>
      </div>
      <div class="desc">
        <strong>作品名称：小木屋</strong>
        这里写介绍...
      </div>
    </div>
  </div>
</div>

<!-- ========== 其他分类 ========== -->
<div id="character-modeling" class="page"><h2>角色建模</h2></div>
<div id="painting" class="page"><h2>绘画作品</h2></div>
<div id="handcraft" class="page"><h2>手工作品</h2></div>
<div id="2d-animation" class="page"><h2>二维动画</h2></div>
<div id="3d-animation" class="page"><h2>三维动画</h2></div>

<!-- ========================================== -->
<!-- 终极交互逻辑 -->
<!-- ========================================== -->
<script>
function showPage(id) {
  // 1. 隐藏所有页面
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].style.display = 'none'; 
  }
  
  // 2. 显示目标页面
  var targetPage = document.getElementById(id);
  if (targetPage) {
    // 【关键修复】如果点击的是首页，用 flex 布局让它居中；如果是其他页面，用 block
    if (id === 'home') {
      targetPage.style.display = 'flex'; 
    } else {
      targetPage.style.display = 'block'; 
    }
  }
  
  // 3. 返回按钮
  var backBtn = document.getElementById('global-back');
  if (id === 'home') {
    backBtn.style.display = 'none';
  } else {
    backBtn.style.display = 'block';
  }
  
  // 4. 回到顶部
  window.scrollTo(0, 0);
}

// 多图相册切换
function changeImg(element, newSrc) {
  var card = element.closest('.work-card');
  var mainImg = card.querySelector('.main-img');
  mainImg.src = newSrc;
}
</script>

</body>
</html>
